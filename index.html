<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draft Serie A - La Stagione Perfetta</title>
    <style>
        :root {
            --bg-main: #020617; 
            --bg-card: #0f172a; 
            --bg-input: #1e293b;
            --pitch-green: #14532d; 
            --pitch-grass-dark: #0f3f21; 
            --pitch-lines: rgba(255, 255, 255, 0.45);
            --accent-gold: #cfb53b; 
            --accent-blue: #3b82f6; 
            --accent-danger: #ef4444;
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --card-border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 25px 20px; }
        
        /* LOGO PROPRIETARIO */
        .custom-logo { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 30px; }
        .scudetto {
            width: 55px; height: 65px;
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            border: 2px solid var(--accent-gold);
            border-radius: 4px 4px 28px 28px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(207, 181, 59, 0.3);
            position: relative; overflow: hidden;
        }
        .scudetto::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 6px;
            background: linear-gradient(to right, #009246 33%, #ffffff 33%, #ffffff 66%, #ce2b37 66%);
        }
        .scudetto span { color: white; font-weight: 900; font-size: 1.3rem; line-height: 1; text-align: center; margin-top: 6px; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);}
        .logo-text h1 { margin: 0; font-size: 2.4rem; color: #f8fafc; letter-spacing: 0.5px; font-weight: 800; }
        .logo-text h1 span { color: var(--accent-gold); }
        .logo-text p { margin: 0; color: #94a3b8; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600;}
        
        .container { width: 100%; max-width: 1100px; background-color: var(--bg-card); border-radius: 14px; padding: 30px; border: 1px solid var(--card-border); box-shadow: 0 15px 40px rgba(0,0,0,0.6); }
        .hidden { display: none !important; }

        /* Fix Schermata Setup Centrata */
        #setup-screen { max-width: 600px; margin: 0 auto; text-align: center; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .form-group { display: flex; flex-direction: column; text-align: left; }
        label { margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }
        select { padding: 14px; border-radius: 8px; border: 1px solid var(--card-border); background-color: var(--bg-input); color: white; font-size: 1rem; outline: none; transition: 0.2s;}
        select:focus { border-color: var(--accent-gold); }
        
        .btn { background: linear-gradient(135deg, var(--accent-gold) 0%, #b49b2c 100%); color: var(--bg-main); font-weight: 800; padding: 16px; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; width: 100%; transition: 0.2s; font-size: 1.05rem; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(207, 181, 59, 0.2);}
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(207, 181, 59, 0.4); }
        .btn-danger { background: var(--bg-input); color: var(--accent-danger); border: 1px solid var(--accent-danger); margin-top: 12px; box-shadow: none;}
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.1); box-shadow: none; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .game-layout { display: grid; grid-template-columns: 460px 1fr; gap: 35px; }
        @media (max-width: 950px) { .game-layout { grid-template-columns: 1fr; } }

        /* Dashboard Statistiche */
        .stats-dashboard { display: flex; justify-content: space-between; padding: 15px 25px; border-radius: 10px; margin-bottom: 25px; border: 1px solid var(--card-border); background: var(--bg-input); }
        .stat-box { text-align: center; width: 30%; border-right: 1px solid var(--card-border); }
        .stat-box:last-child { border-right: none; }
        .stat-label { font-size: 0.8rem; color: var(--accent-gold); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px;}
        .stat-value { font-size: 2rem; font-weight: 900; color: var(--text-main); font-variant-numeric: tabular-nums; }

        /* Campo da Gioco */
        .pitch-container { display: flex; flex-direction: column; align-items: center; }
        .pitch-wrapper { background-color: var(--pitch-green); background-image: linear-gradient(to bottom, var(--pitch-green) 50%, var(--pitch-grass-dark) 50%); background-size: 100% 18.18%; border-radius: 8px; position: relative; width: 100%; max-width: 460px; aspect-ratio: 3.2 / 4.2; border: 2px solid var(--pitch-lines); box-shadow: inset 0 0 40px rgba(0,0,0,0.5);}
        .pitch-line { position: absolute; border: 2px solid var(--pitch-lines); }
        .center-line { top: 50%; left: 0; width: 100%; height: 0; }
        .center-circle { top: 50%; left: 50%; width: 24%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); }
        .penalty-top { top: 0; left: 22%; width: 56%; height: 16%; border-top: none; }
        .penalty-bot { bottom: 0; left: 22%; width: 56%; height: 16%; border-bottom: none; }

        .slots-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;}
        .pitch-slot { position: absolute; width: 68px; height: 84px; transform: translate(-50%, -50%); background: rgba(2, 6, 23, 0.7); border: 2px dashed rgba(255,255,255,0.3); border-radius: 8px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; cursor: not-allowed; color: var(--text-muted); transition: 0.2s; backdrop-filter: blur(2px);}
        .pitch-slot.active-target { border-color: var(--accent-gold); background: rgba(207, 181, 59, 0.2); cursor: pointer; color: white; border-style: solid; box-shadow: 0 0 15px rgba(207, 181, 59, 0.4); animation: pulse 1.5s infinite; }
        .pitch-slot.filled { background: var(--bg-input); border: 2px solid var(--accent-gold); cursor: default; color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.4);}
        
        .slot-ovr { font-weight: 900; font-size: 1.25rem; line-height: 1.1;}
        .slot-name { font-weight: 700; font-size: 0.65rem; margin-top: 3px; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;}
        .slot-pos-tag { font-size: 0.55rem; background: var(--bg-card); padding: 2px 5px; border-radius: 4px; margin-top: 3px; color: var(--text-muted); font-weight: bold; border: 1px solid var(--card-border);}

        /* Griglia Carte */
        .roll-banner { border-bottom: 1px solid var(--card-border); padding-bottom: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-end;}
        .roll-banner h2 { font-size: 1.6rem; font-weight: 800; color: #fff;}
        .roll-banner span.era { font-size: 0.95rem; color: var(--bg-main); font-weight: 800; background: var(--accent-gold); padding: 4px 10px; border-radius: 4px;}
        
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; max-height: 480px; overflow-y: auto; padding-right: 8px; margin-bottom: 20px;}
        .cards-grid::-webkit-scrollbar { width: 6px; } .cards-grid::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

        .player-card { background: linear-gradient(145deg, var(--bg-input) 0%, var(--bg-card) 100%); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 8px; text-align: center; cursor: pointer; position: relative; min-height: 135px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2);}
        .player-card:hover { border-color: var(--accent-gold); transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.4);}
        .player-card.selected { border-color: var(--accent-gold); background: rgba(207, 181, 59, 0.15); box-shadow: 0 0 15px rgba(207, 181, 59, 0.4); }
        
        .player-card.disabled-card { opacity: 0.3; cursor: not-allowed; pointer-events: none; filter: grayscale(80%);}
        .player-card.duplicate { border-color: var(--accent-danger); opacity: 0.4; }

        .card-ovr { font-size: 1.9rem; font-weight: 900; line-height: 1; margin-bottom: 2px;}
        .card-ovr.bronze { color: #d97706; } .card-ovr.silver { color: #cbd5e1; } .card-ovr.gold { color: #facc15; } .card-ovr.icon { color: var(--accent-blue); text-shadow: 0 0 8px rgba(59, 130, 246, 0.4);} 
        .card-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 6px; line-height: 1.1;}
        .role-tag { font-size: 0.6rem; color: var(--text-main); background: var(--bg-main); border: 1px solid var(--card-border); padding: 2px 5px; border-radius: 4px; margin: 1px; display: inline-block; font-weight: 600;}

        .status-message { font-size: 0.95rem; text-align: center; margin-top: 15px; color: var(--text-muted); min-height: 20px; font-weight: 500;}

        .result-screen { text-align: center; padding: 40px 0; }
        .final-score { font-size: 6.5rem; font-weight: 900; color: var(--accent-gold); margin: 10px 0; letter-spacing: -3px; text-shadow: 0 0 30px rgba(207, 181, 59, 0.2);}
        
        @keyframes pulse { 0% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.04); } 100% { transform: translate(-50%, -50%) scale(1); } }
    </style>
    <script src="database.js"></script>
</head>
<body>

    <header>
        <div class="custom-logo">
            <div class="scudetto">
                <span>38<br>0</span>
            </div>
            <div class="logo-text">
                <h1>DRAFT <span>SERIE A</span></h1>
                <p>La Stagione Perfetta</p>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="setup-screen">
            <div id="db-status" style="margin-bottom: 15px; color: var(--accent-danger); font-weight: bold;"></div>
            <div class="setup-grid">
                <div class="form-group">
                    <label>Modulo Tattico</label>
                    <select id="formation-select">
                        <option value="433">4-3-3</option>
                        <option value="442">4-4-2</option>
                        <option value="4231">4-2-3-1</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Difficoltà</label>
                    <select id="mode-select">
                        <option value="easy">Normale (Overall e Ruoli Visibili)</option>
                        <option value="hard">Difficile (Draft alla Cieca)</option>
                    </select>
                </div>
            </div>
            <button id="start-game-btn" class="btn">Inizia il Draft</button>
        </div>

        <div id="game-screen" class="hidden">
            <div class="stats-dashboard">
                <div class="stat-box"><div class="stat-label">Attacco</div><div class="stat-value" id="stat-att">00</div></div>
                <div class="stat-box"><div class="stat-label">Centrocampo</div><div class="stat-value" id="stat-cen">00</div></div>
                <div class="stat-box"><div class="stat-label">Difesa</div><div class="stat-value" id="stat-dif">00</div></div>
            </div>

            <div class="game-layout">
                <div class="pitch-container">
                    <div class="pitch-wrapper">
                        <div class="pitch-line center-line"></div><div class="pitch-line center-circle"></div>
                        <div class="pitch-line penalty-top"></div><div class="pitch-line penalty-bot"></div>
                        <div id="slots-layout" class="slots-container"></div>
                    </div>
                </div>

                <div class="draft-panel">
                    <div class="roll-banner">
                        <h2 id="current-roll-team">-</h2>
                        <span class="era" id="current-roll-era">-</span>
                    </div>
                    <div id="cards-container" class="cards-grid"></div>

                    <div>
                        <button id="roll-btn" class="btn">Estrai Squadra</button>
                        <button id="skip-btn" class="btn btn-danger hidden">Scarta Roster (Salta Turno)</button>
                        <div id="status-text" class="status-message">Clicca su 'Estrai Squadra' per iniziare.</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <div style="text-transform: uppercase; font-weight: bold; color: var(--text-muted); letter-spacing: 2px;">Record Finale</div>
            <div id="final-record" class="final-score">0-0-0</div>
            <div class="stats-dashboard" style="max-width: 500px; margin: 0 auto 30px auto;">
                <div class="stat-box"><div class="stat-label">ATT Val.</div><div class="stat-value" id="final-att">00</div></div>
                <div class="stat-box"><div class="stat-label">CEN Val.</div><div class="stat-value" id="final-cen">00</div></div>
                <div class="stat-box"><div class="stat-label">DIF Val.</div><div class="stat-value" id="final-dif">00</div></div>
            </div>
            <p id="result-commentary" style="color:var(--text-muted); font-size: 1.15rem; margin: 20px auto; max-width: 650px; line-height: 1.6;"></p>
            <button id="reset-btn" class="btn" style="max-width: 320px; margin: 0 auto;">Gioca Ancora</button>
        </div>
    </div>

    <script>
        const formationsConfig = {
            "433": [
                { id: 1, pos: "POR", zone: "DEF", x: 50, y: 89 }, { id: 2, pos: "TS", zone: "DEF", x: 16, y: 72 }, { id: 3, pos: "DC", zone: "DEF", x: 38, y: 75 },
                { id: 4, pos: "DC", zone: "DEF", x: 62, y: 75 }, { id: 5, pos: "TD", zone: "DEF", x: 84, y: 72 }, { id: 6, pos: "CC", zone: "MID", x: 50, y: 53 },
                { id: 7, pos: "CC", zone: "MID", x: 26, y: 46 }, { id: 8, pos: "CC", zone: "MID", x: 74, y: 46 }, { id: 9, pos: "AS", zone: "ATT", x: 22, y: 20 },
                { id: 10, pos: "ATT", zone: "ATT", x: 50, y: 15 }, { id: 11, pos: "AD", zone: "ATT", x: 78, y: 20 }
            ],
            "442": [
                { id: 1, pos: "POR", zone: "DEF", x: 50, y: 89 }, { id: 2, pos: "TS", zone: "DEF", x: 16, y: 72 }, { id: 3, pos: "DC", zone: "DEF", x: 38, y: 75 },
                { id: 4, pos: "DC", zone: "DEF", x: 62, y: 75 }, { id: 5, pos: "TD", zone: "DEF", x: 84, y: 72 }, { id: 6, pos: "ES", zone: "MID", x: 16, y: 46 },
                { id: 7, pos: "CC", zone: "MID", x: 38, y: 50 }, { id: 8, pos: "CC", zone: "MID", x: 62, y: 50 }, { id: 9, pos: "ED", zone: "MID", x: 84, y: 46 },
                { id: 10, pos: "ATT", zone: "ATT", x: 34, y: 18 }, { id: 11, pos: "ATT", zone: "ATT", x: 66, y: 18 }
            ],
            "4231": [
                { id: 1, pos: "POR", zone: "DEF", x: 50, y: 89 }, { id: 2, pos: "TS", zone: "DEF", x: 16, y: 72 }, { id: 3, pos: "DC", zone: "DEF", x: 38, y: 75 },
                { id: 4, pos: "DC", zone: "DEF", x: 62, y: 75 }, { id: 5, pos: "TD", zone: "DEF", x: 84, y: 72 }, { id: 6, pos: "MED", zone: "MID", x: 35, y: 57 },
                { id: 7, pos: "MED", zone: "MID", x: 65, y: 57 }, { id: 8, pos: "TRQ", zone: "MID", x: 50, y: 36 }, { id: 9, pos: "ES", zone: "MID", x: 18, y: 30 }, 
                { id: 10, pos: "ED", zone: "MID", x: 82, y: 30 }, { id: 11, pos: "ATT", zone: "ATT", x: 50, y: 14 }
            ]
        };

        let gameState = {
            formation: "433", mode: "easy", slots: [], selectedPlayer: null, rolledPool: [], 
            currentTeam: "", currentEra: "", turnIsActive: false, filledCount: 0, recentTeams: []
        };

        document.addEventListener("DOMContentLoaded", () => {
            if (typeof playerDatabase === 'undefined' || playerDatabase.length === 0) {
                document.getElementById("db-status").innerText = "ERRORE: database.js non trovato. Inseriscilo nella stessa cartella!";
                document.getElementById("start-game-btn").disabled = true;
            }

            document.getElementById("start-game-btn").addEventListener("click", startGame);
            document.getElementById("roll-btn").addEventListener("click", rollOptions);
            document.getElementById("skip-btn").addEventListener("click", skipTurn);
            document.getElementById("reset-btn").addEventListener("click", resetGame);
        });

        function startGame() {
            gameState.formation = document.getElementById("formation-select").value;
            gameState.mode = document.getElementById("mode-select").value;
            document.getElementById("setup-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            buildPitch();
            resetRollState();
            updateLiveStats();
        }

        function buildPitch() {
            const container = document.getElementById("slots-layout");
            container.innerHTML = "";
            const config = formationsConfig[gameState.formation];
            gameState.slots = config.map(s => ({ ...s, player: null }));
            gameState.filledCount = 0;
            gameState.recentTeams = [];

            gameState.slots.forEach(slot => {
                const div = document.createElement("div");
                div.className = "pitch-slot"; div.id = `slot-${slot.id}`;
                div.style.left = `${slot.x}%`; div.style.top = `${slot.y}%`;
                div.innerHTML = `<div style="font-weight:900; font-size: 1.2rem;">+</div><div class="slot-pos-tag">${slot.pos}</div>`;
                div.addEventListener("click", () => assignPlayerToSlot(slot.id));
                container.appendChild(div);
            });
        }

        function resetRollState() {
            gameState.selectedPlayer = null; gameState.rolledPool = []; gameState.turnIsActive = false;
            document.getElementById("current-roll-team").innerText = "IN ATTESA...";
            document.getElementById("current-roll-era").innerText = "-";
            document.getElementById("cards-container").innerHTML = "";
            document.getElementById("roll-btn").disabled = false;
            document.getElementById("skip-btn").classList.add("hidden");
            document.getElementById("status-text").innerText = "";
        }

        function rollOptions() {
            if (gameState.selectedPlayer) { alert("Posiziona in campo il giocatore selezionato prima di estrarre!"); return; }

            const groups = {};
            playerDatabase.forEach(p => {
                const key = p.team + "||" + p.era;
                if(!groups[key]) groups[key] = [];
                groups[key].push(p);
            });

            const allKeys = Object.keys(groups);
            // Filtro Cooldown ora basato sulla combinazione univoca "Squadra||Epoca"
            let availableKeys = allKeys.filter(k => !gameState.recentTeams.includes(k));
            if (availableKeys.length === 0) availableKeys = allKeys; 

            const chosenKey = availableKeys[Math.floor(Math.random() * availableKeys.length)];
            const matchPool = groups[chosenKey];

            gameState.currentTeam = matchPool[0].team;
            gameState.currentEra = matchPool[0].era;

            document.getElementById("current-roll-team").innerText = gameState.currentTeam;
            document.getElementById("current-roll-era").innerText = gameState.currentEra;

            gameState.rolledPool = [...matchPool].sort((a,b) => b.ovr - a.ovr);
            gameState.turnIsActive = true;
            gameState.selectedPlayer = null;
            
            renderCards();
            evaluateTurnFeasibility();
            document.getElementById("roll-btn").disabled = true;
        }

        function renderCards() {
            const container = document.getElementById("cards-container");
            container.innerHTML = "";

            gameState.rolledPool.forEach((player, idx) => {
                const card = document.createElement("div");
                card.className = "player-card";
                card.id = `player-card-${idx}`;
                card.addEventListener("click", () => selectCard(idx, player));

                let displayOvr = "??"; let colorClass = "";
                let rolesHTML = "??";
                
                if (gameState.mode === "easy") {
                    displayOvr = player.ovr;
                    if (player.ovr >= 90) colorClass = "icon";
                    else if (player.ovr >= 82) colorClass = "gold";
                    else if (player.ovr >= 75) colorClass = "silver";
                    else colorClass = "bronze";
                    
                    rolesHTML = player.roles.map(r => `<span class="role-tag">${r}</span>`).join("");
                }

                card.innerHTML = `
                    <div>
                        <div class="card-ovr ${colorClass}">${displayOvr}</div>
                        <div class="card-name">${player.name}</div>
                    </div>
                    <div>${rolesHTML}</div>
                `;
                container.appendChild(card);
            });
        }

        function evaluateTurnFeasibility() {
            let directMatchPossible = false;
            
            gameState.rolledPool.forEach((player, idx) => {
                const isDuplicate = gameState.slots.some(slot => slot.player && slot.player.name === player.name);
                const standardFit = gameState.slots.some(slot => !slot.player && player.roles.includes(slot.pos));
                const cardEl = document.getElementById(`player-card-${idx}`);
                
                if (isDuplicate) {
                    if (cardEl) { cardEl.classList.add("disabled-card", "duplicate"); }
                } else if (!standardFit && gameState.mode === "easy") {
                    if (cardEl) cardEl.classList.add("disabled-card");
                } else if (standardFit) {
                    directMatchPossible = true;
                }
            });

            if (!directMatchPossible && gameState.mode === "easy") {
                document.getElementById("status-text").innerText = "Nessun giocatore inseribile in campo. Devi saltare il turno.";
                document.getElementById("skip-btn").classList.remove("hidden");
            } else {
                document.getElementById("skip-btn").classList.add("hidden");
                if(gameState.mode === "hard") document.getElementById("skip-btn").classList.remove("hidden");
            }
        }

        function selectCard(idx, player) {
            if (!gameState.turnIsActive) return;
            
            const isDuplicate = gameState.slots.some(slot => slot.player && slot.player.name === player.name);
            if(isDuplicate) { alert("Questo giocatore è già presente nella tua squadra!"); return; }

            const hasSlot = gameState.slots.some(slot => !slot.player && player.roles.includes(slot.pos));
            if (!hasSlot) { alert("Nessuna posizione valida per i ruoli di questo giocatore."); return; }

            document.querySelectorAll(".player-card").forEach(c => c.classList.remove("selected"));
            document.getElementById(`player-card-${idx}`).classList.add("selected");
            
            gameState.selectedPlayer = player;

            gameState.slots.forEach(slot => {
                const el = document.getElementById(`slot-${slot.id}`);
                el.classList.remove("active-target");
                if (!slot.player && player.roles.includes(slot.pos)) el.classList.add("active-target");
            });
        }

        function assignPlayerToSlot(slotId) {
            if (!gameState.selectedPlayer) return;
            const slot = gameState.slots.find(s => s.id === slotId);
            
            if (!gameState.selectedPlayer.roles.includes(slot.pos)) { alert("Posizione non valida per questo giocatore."); return; }
            if (slot.player) { return; }

            slot.player = gameState.selectedPlayer;
            gameState.filledCount++;
            
            // Salvataggio per Cooldown usando Squadra+Epoca
            const currentKey = gameState.currentTeam + "||" + gameState.currentEra;
            gameState.recentTeams.push(currentKey);
            if (gameState.recentTeams.length > 5) gameState.recentTeams.shift();

            const el = document.getElementById(`slot-${slotId}`);
            el.classList.remove("active-target"); el.classList.add("filled");

            let displayOvr = gameState.mode === "easy" ? slot.player.ovr : "??";
            el.innerHTML = `
                <div class="slot-ovr" style="color: ${getOvrColor(slot.player.ovr)}">${displayOvr}</div>
                <div class="slot-name">${slot.player.name}</div>
            `;

            document.querySelectorAll(".pitch-slot").forEach(s => s.classList.remove("active-target"));
            updateLiveStats();
            resetRollState();

            if (gameState.filledCount === 11) endGame();
        }

        function getOvrColor(ovr) {
            if(gameState.mode === "hard") return "white";
            if(ovr >= 90) return "var(--accent-blue)";
            if(ovr >= 82) return "var(--accent-gold)";
            if(ovr >= 75) return "var(--text-muted)";
            return "#d97706";
        }

        function skipTurn() {
            if (confirm("Sei sicuro di voler scartare questo roster intero?")) {
                const currentKey = gameState.currentTeam + "||" + gameState.currentEra;
                gameState.recentTeams.push(currentKey);
                if (gameState.recentTeams.length > 5) gameState.recentTeams.shift();
                resetRollState();
            }
        }

        function getZoneStats() {
            let stats = { ATT: { sum: 0, count: 0 }, MID: { sum: 0, count: 0 }, DEF: { sum: 0, count: 0 } };
            gameState.slots.forEach(s => {
                if (s.player) {
                    if (s.zone === "ATT") { stats.ATT.sum += s.player.ovr; stats.ATT.count++; }
                    if (s.zone === "MID") { stats.MID.sum += s.player.ovr; stats.MID.count++; }
                    if (s.zone === "DEF") { stats.DEF.sum += s.player.ovr; stats.DEF.count++; }
                }
            });
            return { 
                att: stats.ATT.count > 0 ? Math.round(stats.ATT.sum / stats.ATT.count) : 0, 
                mid: stats.MID.count > 0 ? Math.round(stats.MID.sum / stats.MID.count) : 0, 
                def: stats.DEF.count > 0 ? Math.round(stats.DEF.sum / stats.DEF.count) : 0 
            };
        }

        function updateLiveStats() {
            if(gameState.mode === "hard") return;
            const stats = getZoneStats();
            document.getElementById("stat-att").innerText = stats.att > 0 ? stats.att : "00";
            document.getElementById("stat-cen").innerText = stats.mid > 0 ? stats.mid : "00";
            document.getElementById("stat-dif").innerText = stats.def > 0 ? stats.def : "00";
        }

        function calculateAdvancedRecord(att, mid, def) {
            // Algoritmo reso leggermente più facile
            const teamRating = (att * 1.1 + mid * 0.95 + def * 1.05) / 3.1;
            
            // Penalità ridotta, si applica solo con più di 6 di scarto
            const imbalance = Math.max(Math.abs(att - def), Math.abs(att - mid), Math.abs(mid - def));
            const penalty = imbalance > 6 ? (imbalance - 6) * 0.35 : 0; 
            const finalScore = teamRating - penalty;

            let w = 0, d = 0, l = 0;
            
            // Soglia abbassata a 88.5
            if (finalScore >= 88.5) { w=38; d=0; l=0; }
            else if (finalScore >= 86.5) { w=34; d=4; l=0; }
            else if (finalScore >= 84.0) { w=30; d=5; l=3; }
            else if (finalScore >= 81.0) { w=26; d=7; l=5; }
            else if (finalScore >= 77.0) { w=20; d=10; l=8; }
            else if (finalScore >= 73.0) { w=14; d=12; l=12; }
            else { w=8; d=10; l=20; }
            return { w, d, l };
        }

        function endGame() {
            document.getElementById("game-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            const finalStats = getZoneStats();
            document.getElementById("final-att").innerText = finalStats.att;
            document.getElementById("final-cen").innerText = finalStats.mid;
            document.getElementById("final-dif").innerText = finalStats.def;

            const sim = calculateAdvancedRecord(finalStats.att, finalStats.mid, finalStats.def);
            document.getElementById("final-record").innerText = `${sim.w} - ${sim.d} - ${sim.l}`;

            let commentary = "";
            if (sim.w === 38) { commentary = "🏆 STAGIONE PERFETTA! Hai costruito una corazzata in grado di dominare il campionato senza mai perdere o pareggiare. 38-0 clamoroso!"; }
            else if (sim.w >= 30) { commentary = "🥇 CAMPIONI D'ITALIA! Scudetto vinto in carrozza, squadra letale. È mancato solo un pizzico di bilanciamento per l'imbattibilità totale."; }
            else if (sim.w >= 20) { commentary = "🇪🇺 QUALIFICAZIONE IN CHAMPIONS. Ottimo campionato, ma ti sei affidato troppo a qualche stella trascurando i reparti deboli scelti dalla panchina."; }
            else if (sim.w >= 14) { commentary = "📉 METÀ CLASSIFICA. Troppi giocatori tappabuchi o provenienti dalle squadre 'Meme'. La squadra ha sofferto tatticamente."; }
            else { commentary = "☠️ RETROCESSIONE! Un disastro manageriale. La rosa era palesemente squilibrata e i giocatori fuori condizione hanno condannato la squadra."; }

            document.getElementById("result-commentary").innerText = commentary;
        }

        function resetGame() {
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("setup-screen").classList.remove("hidden");
        }
    </script>
</body>
</html>
